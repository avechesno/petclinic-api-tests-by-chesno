name: petclinic-by-chesno
services:
  petclinic:
    # Образ из репозитория проекта; неизменяемый digest для linux/amd64 зафиксирован 2026-10-13.
    # Происхождение образа не доказывает соответствие контракту: см. docs/contract/README.md.
    image: ${PETCLINIC_IMAGE:-springcommunity/spring-petclinic-rest@sha256:67bd566c74e226b8d9873055387208a237b81cad79b6d18b534d20515b3bf0c7}
    platform: linux/amd64
    ports:
      - "127.0.0.1:${PETCLINIC_PORT:-9966}:9966"
    environment:
      SPRING_PROFILES_ACTIVE: h2,spring-data-jpa
      PETCLINIC_SECURITY_ENABLE: "false"
      SPRING_DATASOURCE_URL: jdbc:h2:mem:petclinic;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Каталоги хоста, сокет Docker, секреты и постоянные тома базы данных не подключаются.
